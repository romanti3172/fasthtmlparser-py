[package]
name = "fasthtmlparser-py"
version = "0.1.2"
edition = "2021"
publish = false

[lib]
name = "_fasthtmlparser"
crate-type = ["cdylib"]

[dependencies]
fasthtmlparser = "0.1"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310", "generate-import-lib"] }

[profile.release]
lto = "fat"
codegen-units = 1
